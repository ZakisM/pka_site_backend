name: Build and Test

on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'nginx.conf'
      - 'pka_db.sqlite3'
    branches: [ master ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Download Sqlite3
        run: sudo apt-get install libsqlite3-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Lint with Clippy
        run: cargo clippy -- -D warnings

      - name: Build
        run: cargo build

      - name: Run tests
        run: cargo test --verbose

  # The image is only published from master (deploy.yml), so build it here too,
  # with the same actions: a broken Dockerfile, or an update to one of those
  # actions that breaks the build, fails the pull request instead of the deploy.
  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Nothing pushes, so keep the token out of .git/config.
          persist-credentials: false
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: zakism/pka-index-backend
          tags: type=ref,event=pr
      - name: Build the image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
