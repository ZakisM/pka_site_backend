name: Dependabot auto-merge

# Turns on auto-merge for Dependabot's minor and patch updates, once every
# release in them is at least 7 days old. GitHub merges them once the required
# checks (Build and Test) pass; a failing check leaves the pull request open. Major
# updates are left for a person to review.
#
# Only Dependabot's own commits are merged this way: the pull request has to be
# Dependabot's, the push Dependabot's, and fetch-metadata refuses a branch with
# a commit that isn't a signed one from Dependabot. If anyone else pushes to the
# branch, auto-merge is turned off again and the pull request waits for review.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.repository == 'ZakisM/pka_site_backend'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.actor == 'dependabot[bot]'
    steps:
      - name: Read the update's metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # Dependabot's cooldown (dependabot.yml) doesn't apply to security
      # updates, so check every release's age here too: a "fix" published by
      # someone who has taken over a package never merges by itself. If it's too
      # new, the pull request waits; the next push from Dependabot checks again.
      - name: Check every release is at least 7 days old
        id: age
        run: |
          python3 -I - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          from datetime import datetime, timedelta, timezone

          MIN_AGE = timedelta(days=7)
          UA = {"User-Agent": "dependabot-auto-merge (GitHub Actions)"}

          def get(url, headers=None):
              req = urllib.request.Request(url, headers={**UA, **(headers or {})})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          def published(ecosystem, name, version):
              if ecosystem == "npm_and_yarn":
                  doc = get("https://registry.npmjs.org/" + urllib.parse.quote(name, safe="@"))
                  return doc["time"][version]
              if ecosystem == "cargo":
                  doc = get(f"https://crates.io/api/v1/crates/{name}/{version}")
                  return doc["version"]["created_at"]
              if ecosystem == "github_actions":
                  repo = "/".join(name.split("/")[:2])
                  auth = {"Authorization": "Bearer " + os.environ["GH_TOKEN"]}
                  for tag in (version, "v" + version.removeprefix("v")):
                      try:
                          return get(f"https://api.github.com/repos/{repo}/releases/tags/{tag}", auth)["published_at"]
                      except urllib.error.HTTPError as e:
                          if e.code != 404:
                              raise
                  raise LookupError("no release for that tag")
              raise LookupError("unknown ecosystem")

          ecosystem = os.environ["ECOSYSTEM"]
          ok = True
          for dep in json.loads(os.environ["DEPS"]):
              name, version = dep["dependencyName"], dep["newVersion"]
              try:
                  when = datetime.fromisoformat(published(ecosystem, name, version).replace("Z", "+00:00"))
              except Exception as e:
                  print(f"::notice::Couldn't find when {name} {version} was published ({e!r}), so not auto-merging")
                  ok = False
                  continue
              age = datetime.now(timezone.utc) - when
              print(f"{name} {version}: published {when:%Y-%m-%d}, {age.days} days ago")
              if age < MIN_AGE:
                  print(f"::notice::{name} {version} is under {MIN_AGE.days} days old, so not auto-merging")
                  ok = False

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"old-enough={str(ok).lower()}\n")
          PY
        env:
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          DEPS: ${{ steps.metadata.outputs.updated-dependencies-json }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major'
          && steps.age.outputs.old-enough == 'true'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  disable-auto-merge:
    name: Disable auto-merge after someone else's push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.repository == 'ZakisM/pka_site_backend'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.actor != 'dependabot[bot]'
      && github.event.pull_request.auto_merge != null
    steps:
      - name: Disable auto-merge
        run: gh pr merge --disable-auto "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
