name: Build and Push images

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'nginx.conf'
    branches: [ master ]
  # Dependabot's pull requests are merged by GitHub Actions' own token, and a
  # push made with that token starts no workflows, so they'd never publish.
  # Rebuild weekly to pick them up, or run it by hand to publish one sooner.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

# One publish at a time, so an older build can't overwrite a newer one.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and Push pka-index-backend
    # A manual run can be started from any branch; only master publishes.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Download Sqlite3
        run: sudo apt-get install libsqlite3-dev
      - name: Run tests
        run: cargo test --verbose
      - name: Log in to DockerHub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: zakism/pka-index-backend
          # Only :master, whatever started the run (a scheduled run would add :nightly).
          tags: type=ref,event=branch
      - name: Build and push Docker image
        uses: docker/build-push-action@v5.1.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
