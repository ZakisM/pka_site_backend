[package]
name = "pka_site_backend"
version = "0.1.0"
authors = ["Zak"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8", features = ["macros", "json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
rand = "0.10"
sqlx = { version = "0.9", features = ["runtime-tokio", "macros", "sqlite"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", features = ["gzip", "query"] }
regex = "1"
quick-xml = { version = "0.42", features = ["serialize"] }
iso8601-duration = { version = "0.2.0", features = ["chrono"] }
dotenvy = "0.15"
mimalloc = "0.1.39"
compact_str = { version = "0.10", features = ["serde", "sqlx-sqlite"] }
aho-corasick = "1.1.2"
tower-http = { version = "0.7", features = ["cors", "compression-br", "compression-gzip"] }
thiserror = "2.0"
anyhow = "1"
# Both already built for tower-http's compression; used directly to
# precompress the episode list once per snapshot.
brotli = "9"
flate2 = "1"
envy = "0.4.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = 'fat'
codegen-units = 1
strip = true
