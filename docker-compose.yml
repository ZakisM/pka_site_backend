services:
  app:
    image: zakism/pka-index-backend:master
    volumes:
      - ./pka_index_data:/app/pka_index_data
    environment:
      - YT_API_KEY=$YT_API_KEY
    ports:
      - "127.0.0.1:1234:1234"
    restart: always

  react-frontend:
    image: zakism/pka-index-frontend:master
    ports:
      - 127.0.0.1:5678:5678
    restart: always
